name: Build and publish Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version matching the source, e.g. 0.1.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release inputs
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.version -ne $env:RELEASE_VERSION) { throw 'Update the source version before releasing.' }
          if (!(Test-Path -LiteralPath "docs/releases/v$env:RELEASE_VERSION.md")) { throw 'Add release notes first.' }
          gh release view "v$env:RELEASE_VERSION" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This release already exists; use a new version.' }
          $global:LASTEXITCODE = 0
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Select Rust stable
        run: rustup default stable
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check ui/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/toolbox.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/icons.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build release binary
        run: npm run build
      - name: Package and checksum
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION
      - name: Publish release
        shell: pwsh
        run: |
          $stem = "Qyflux-v$env:RELEASE_VERSION-windows-x64"
          gh release create "v$env:RELEASE_VERSION" "dist/$stem.exe" "dist/$stem.zip" dist/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Qyflux v$env:RELEASE_VERSION" --notes-file "docs/releases/v$env:RELEASE_VERSION.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
